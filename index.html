<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто ты в этом цирке?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #AAEE44;
            --text-main: #ffffff;
            --text-sec: #aaaaaa;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.1;
            z-index: -1;
            pointer-events: none;
        }

        header {
            text-align: center;
            padding: 15px 20px 10px;
            flex-shrink: 0;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p.subtitle {
            color: var(--text-sec);
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: clamp(8px, 1.5vw, 15px);
            padding: 10px clamp(15px, 3vw, 40px);
            flex-grow: 1;
            max-height: calc(100vh - 80px);
        }

        .card {
            background: var(--card-bg);
            border-radius: clamp(8px, 1vw, 16px);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(170, 238, 68, 0.3);
            border-color: var(--accent);
            z-index: 10;
        }

        .img-box {
            flex-grow: 1;
            background: #f7f6e7;
            overflow: hidden;
            position: relative;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .img-box img {
            transform: scale(1.1);
        }

        .text-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(5px);
            padding: clamp(8px, 1vw, 15px);
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .card:hover .text-overlay {
            transform: translateY(0);
        }

        .role-name {
            font-weight: 800;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .action-text {
            font-size: clamp(0.55rem, 0.9vw, 0.75rem);
            color: var(--text-sec);
            font-weight: 600;
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid var(--accent);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* БЫСТРАЯ АНИМАЦИЯ ТОЧЕК ПО КРУГУ */
        .magic-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
        }

        .magic-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }

        @keyframes spinCircle {
            0% { transform: translate(-50%, -50%) rotate(0deg) translateX(35px) rotate(0deg); opacity: 0.3; }
            50% { opacity: 1; box-shadow: 0 0 25px var(--accent), 0 0 40px rgba(170,238,68,0.6); }
            100% { transform: translate(-50%, -50%) rotate(360deg) translateX(35px) rotate(-360deg); opacity: 0.3; }
        }

        .spinning .magic-dot { animation: spinCircle 0.8s linear infinite; opacity: 1; }
        .spinning .magic-dot:nth-child(1) { animation-delay: 0s; }
        .spinning .magic-dot:nth-child(2) { animation-delay: 0.1s; }
        .spinning .magic-dot:nth-child(3) { animation-delay: 0.2s; }
        .spinning .magic-dot:nth-child(4) { animation-delay: 0.3s; }
        .spinning .magic-dot:nth-child(5) { animation-delay: 0.4s; }
        .spinning .magic-dot:nth-child(6) { animation-delay: 0.5s; }
        .spinning .magic-dot:nth-child(7) { animation-delay: 0.6s; }
        .spinning .magic-dot:nth-child(8) { animation-delay: 0.7s; }

        @keyframes finalFlash {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; box-shadow: 0 0 20px var(--accent); }
            50% { transform: translate(-50%, -50%) scale(4); opacity: 1; box-shadow: 0 0 60px var(--accent), 0 0 100px rgba(170,238,68,0.8); }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; box-shadow: 0 0 0 transparent; }
        }

        .flashing .magic-dot {
            animation: finalFlash 0.4s ease-out forwards !important;
            animation-delay: calc(var(--i) * 0.03s) !important;
        }

        .modal-role {
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .modal-role.visible { display: block; opacity: 1; transform: translateY(0); }

        .prediction-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #fff;
            font-weight: 600;
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease 0.1s;
        }

        .prediction-text.visible { display: block; opacity: 1; transform: translateY(0); }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease 0.2s;
        }

        .btn-group.visible { display: flex; opacity: 1; }

        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 0.9rem;
            border: 2px solid var(--accent);
        }

        .btn-primary { background: var(--accent); color: #121212; }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(170, 238, 68, 0.5); transform: scale(1.05); }
        .btn-secondary { background: transparent; color: var(--accent); }
        .btn-secondary:hover { background: rgba(170, 238, 68, 0.1); }

        @media (max-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); }
        }
        @media (max-width: 480px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px; padding: 5px; }
            .modal-content { padding: 25px 20px; min-height: 250px; }
            .prediction-text { font-size: 0.95rem; }
            .magic-container { width: 80px; height: 80px; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <header>
        <h1>Что тебя ждет в новом учебном году?</h1>
        <p class="subtitle">Выбери свою роль и узнай прогноз на сентябрь.</p>
    </header>

    <div class="grid-container" id="gameGrid"></div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="magic-container" id="magicContainer">
                <div class="magic-dot" style="--i:0"></div>
                <div class="magic-dot" style="--i:1"></div>
                <div class="magic-dot" style="--i:2"></div>
                <div class="magic-dot" style="--i:3"></div>
                <div class="magic-dot" style="--i:4"></div>
                <div class="magic-dot" style="--i:5"></div>
                <div class="magic-dot" style="--i:6"></div>
                <div class="magic-dot" style="--i:7"></div>
            </div>
            
            <div class="modal-role" id="mRole"></div>
            <div class="prediction-text" id="mText"></div>
            
            <div class="btn-group" id="btnGroup">
                <button class="btn btn-primary" onclick="getAnotherPrediction()">🔮 Гадать ещё раз</button>
                <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // Магический звук
        function playMagicSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const frequencies = [523.25, 659.25, 783.99, 1046.50];
                
                frequencies.forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                        gainNode.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.05);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                        
                        osc.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        osc.start(audioCtx.currentTime);
                        osc.stop(audioCtx.currentTime + 0.8);
                    }, i * 80);
                });
            } catch (e) {}
        }

        const experts = [
            {
                id: 'videomaker', name: 'Видеограф', img: 'videomaker.jpg',
                predictions: [
                    "Сегодня тебе напишет клиент с бюджетом, о котором ты даже не мечтал. Завтра подпишете договор.",
                    "Завтра ты заключишь большой контракт на съемку. Оплата придет раньше срока.",
                    "Сегодня удача на твоей стороне: старое оборудование продастся по цене нового. Завтра купишь технику мечты."
                ]
            },
            {
                id: 'smm', name: 'SMM-щик', img: 'smm.jpg',
                predictions: [
                    "Сегодня к тебе обратится крупный бренд. Завтра они заплатят за стратегию тройной чек.",
                    "Завтра твой пост принесет столько лидов, что отдел продаж не справится. Клиенты сами найдут тебя.",
                    "Сегодня алгоритмы сжалятся над тобой. Охваты вырастут в 5 раз, а завтра предложат рекламную интеграцию."
                ]
            },
            {
                id: 'psychologist', name: 'Психолог', img: 'psychologist.jpg',
                predictions: [
                    "Сегодня появится клиент, который будет ходить к тебе годами. Завтра он оплатит абонемент на месяц вперед.",
                    "Завтра ты проведешь групповую терапию, которая соберет полный зал. Доход превысит ожидания.",
                    "Сегодня тебе напишут с просьбой о срочной консультации. Час работы сегодня стоит как три обычных."
                ]
            },
            {
                id: 'astrologer', name: 'Астролог', img: 'astrologer.jpg',
                predictions: [
                    "Сегодня звезды сулят богатого клиента. Завтра он закажет натальную карту для всей семьи.",
                    "Завтра твой прогноз станет вирусным. Подписчики начнут массово покупать личные разборы.",
                    "Сегодня интуиция работает на 200%. Ты точно попадешь в боль клиента, и он оставит щедрый чаевые."
                ]
            },
            {
                id: 'stylist', name: 'Стилист', img: 'stylist.jpg',
                predictions: [
                    "Сегодня клиент доверится тебе полностью и купит весь шоппинг-лист. Комиссия будет приятной.",
                    "Завтра ты найдешь винтажную вещь за копейки, которую перепродашь втридорога. Или оставишь себе как инвестицию.",
                    "Сегодня бренды сами предложат сотрудничество. Завтра получишь одежду бесплатно и еще заплатят за обзор."
                ]
            },
            {
                id: 'photographer', name: 'Фотограф', img: 'photographer.jpg',
                predictions: [
                    "Сегодня снимешь портрет, который захочет купить журнал. Завтра гонорар упадет на карту.",
                    "Завтра у тебя будет полная запись на съемки до конца месяца. Цены можно смело повышать.",
                    "Сегодня старый клиент вернется с новым проектом и бюджетом х2. Работа будет в кайф."
                ]
            },
            {
                id: 'ai-specialist', name: 'AI-специалист', img: 'ai-specialist.jpg',
                predictions: [
                    "Сегодня ты автоматизируешь процесс, который сэкономит компании миллионы. Завтра тебе выпишут премию.",
                    "Завтра нейросеть выдаст решение, которое ты продашь как уникальный продукт. Маржа 100%.",
                    "Сегодня к тебе обратятся за консультацией крупные игроки рынка. Их бюджеты тебя приятно удивят."
                ]
            },
            {
                id: 'designer', name: 'Дизайнер', img: 'designer.jpg',
                predictions: [
                    "Сегодня заказчик утвердит макет без правок и сразу переведет полную оплату. Без предоплаты!",
                    "Завтра ты возьмешь дополнительный проект, который закроет все финансовые цели на месяц.",
                    "Сегодня твоё портфолио заметит арт-директор топ-студии. Завтра обсудите условия сотрудничества."
                ]
            },
            {
                id: 'teacher', name: 'Учитель', img: 'teacher.jpg',
                predictions: [
                    "Сегодня родители учеников скинутся на подарок, который превзойдет ожидания. Завтра получишь его на руки.",
                    "Завтра запустится твой онлайн-курс или репетиторство. Первая группа наберется за один вечер.",
                    "Сегодня администрация оценит твои усилия и назначит надбавку. Наконец-то справедливость!"
                ]
            },
            {
                id: 'housewife', name: 'Домохозяйка', img: 'housewife.jpg',
                predictions: [
                    "Сегодня муж обрадует приятной суммой на личные расходы. Завтра потратишь их на то, что давно хотела.",
                    "Завтра бытовые вопросы решатся сами собой, освободив время для подработки или хобби, которое принесет доход.",
                    "Сегодня кто-то из близких сделает дорогой подарок, о котором ты молчала. Интуиция работает!"
                ]
            },
            {
                id: 'blogger', name: 'Блогер', img: 'blogger.jpg',
                predictions: [
                    "Сегодня выйдет реклама, которая принесет больше денег, чем за последний месяц. Завтра выведешь прибыль.",
                    "Завтра блог монетизируется по-новому: подписчики сами начнут донатить или покупать мерч.",
                    "Сегодня алгоритмы выведут тебя в топ. Завтра бренды сами напишут с предложениями о бартере и оплате."
                ]
            },
            {
                id: 'cosmetologist', name: 'Косметолог', img: 'cosmetologist.jpg',
                predictions: [
                    "Сегодня клиент купит курс процедур целиком. Завтра запишется еще трое по его рекомендации.",
                    "Завтра распродашь остатки косметики, которые лежали мертвым грузом. Оборот будет неожиданным.",
                    "Сегодня сделаешь процедуру, после которой клиент станет твоим VIP-постоянником. Чеки будут стабильно высокими."
                ]
            }
        ];

        const grid = document.getElementById('gameGrid');
        const modal = document.getElementById('modal');
        const mRole = document.getElementById('mRole');
        const mText = document.getElementById('mText');
        const btnGroup = document.getElementById('btnGroup');
        const magicContainer = document.getElementById('magicContainer');

        let currentExpert = null;
        let lastIndex = -1; // Для предотвращения повторов

        // Генерация карточек
        experts.forEach(expert => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-box">
                    <img src="${expert.img}" alt="${expert.name}" loading="lazy">
                </div>
                <div class="text-overlay">
                    <div class="role-name">${expert.name}</div>
                    <div class="action-text">Узнай судьбу ↓</div>
                </div>
            `;
            
            card.addEventListener('click', () => startMagic(expert));
            grid.appendChild(card);
        });

        // Быстрая магия
        function startMagic(expert) {
            currentExpert = expert;
            lastIndex = -1; // Сброс при выборе новой роли
            
            runAnimation();
        }

        function runAnimation() {
            // Сброс видимости текста
            mRole.classList.remove('visible');
            mText.classList.remove('visible');
            btnGroup.classList.remove('visible');
            magicContainer.className = 'magic-container';
            
            modal.classList.add('active');
            playMagicSound();
            
            // Запускаем вращение
            requestAnimationFrame(() => {
                magicContainer.classList.add('spinning');
            });
            
            // Через 1.2 секунды - вспышка и показ результата
            setTimeout(() => {
                magicContainer.classList.remove('spinning');
                magicContainer.classList.add('flashing');
                
                setTimeout(() => {
                    showPrediction();
                }, 400);
            }, 1200);
        }

        function showPrediction() {
            const preds = currentExpert.predictions;
            let randomIndex;
            
            // Логика, чтобы не повторялось одно и то же подряд
            do {
                randomIndex = Math.floor(Math.random() * preds.length);
            } while (randomIndex === lastIndex && preds.length > 1);
            
            lastIndex = randomIndex;
            
            mRole.textContent = currentExpert.name;
            mText.textContent = preds[randomIndex];
            
            mRole.classList.add('visible');
            mText.classList.add('visible');
            btnGroup.classList.add('visible');
        }

        function getAnotherPrediction() {
            runAnimation();
        }

        function closeModal() {
            modal.classList.remove('active');
            magicContainer.className = 'magic-container';
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
    </script>
</body>
</html>
